<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* A second chat box, drawn over the game: the same lines Dota's own
     chat shows, in English. Made to look like it belongs there - dark,
     square, names in the players' own colours - and to cost nothing
     while nothing is being said: no blur, no animation that runs on its
     own, and an empty box is not drawn at all. */
  :root {
    --ink: #e8e6df;
    --dim: rgba(232, 230, 223, 0.55);
    --allies: #a5d67a;
    --all: #c9c9c9;
    --panel-top: rgba(14, 17, 22, 0.78);
    --panel-bot: rgba(14, 17, 22, 0.62);
    --edge: rgba(255, 255, 255, 0.07);
    --warn: #ffb454;
    --size: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Radiance", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none;
    cursor: default;
  }
  body { display: flex; flex-direction: column; }
  body.bottom { justify-content: flex-end; }
  #box {
    background: linear-gradient(var(--panel-top), var(--panel-bot));
    border: 1px solid var(--edge);
    border-left: 2px solid rgba(165, 214, 122, 0.55);
    padding: 6px 10px 7px;
    color: var(--ink);
    font-size: var(--size);
    line-height: 1.32;
    /* The game is behind this, so the text needs its own contrast. */
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 0 1px rgba(0, 0, 0, 0.9);
  }
  #box:empty { display: none; }
  .row { padding: 1px 0; transition: opacity 500ms linear; }
  .row.out { opacity: 0; }
  .tag { color: var(--all); margin-right: 5px; }
  .team .tag { color: var(--allies); }
  .name { font-weight: 600; margin-right: 5px; }
  .pending .say { color: var(--dim); font-style: italic; }
  .plain .say { color: var(--dim); }
  .orig { color: var(--dim); font-size: 0.86em; }
  .status { color: var(--warn); font-size: 13px; padding: 1px 0; transition: opacity 500ms linear; }
  .status.out { opacity: 0; }
</style>
</head>
<body>
  <div id="box"></div>
  <script src="overlay.js"></script>
</body>
</html>
