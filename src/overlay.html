<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #f4f7fa;
    --dim: rgba(244, 247, 250, 0.62);
    --name: #7fd4ff;
    --panel: rgba(8, 14, 20, 0.72);
    --edge: rgba(255, 255, 255, 0.10);
    --warn: #ffb454;
    --size: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none;
    cursor: default;
  }
  #list {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 6px;
    padding: 4px;
  }
  .row {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-left: 3px solid var(--name);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--ink);
    font-size: var(--size);
    line-height: 1.35;
    /* The game is behind this, so the text needs its own contrast. */
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(3px);
    animation: in 140ms ease-out;
    transition: opacity 600ms ease;
  }
  .row.out { opacity: 0; }
  .row.plain { border-left-color: var(--warn); }
  .name { color: var(--name); font-weight: 600; margin-right: 6px; }
  .plain .name { color: var(--warn); }
  .orig { display: block; color: var(--dim); font-size: 0.82em; margin-top: 2px; }
  .status {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--warn);
    font-size: 13px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div id="list"></div>
  <script src="overlay.js"></script>
</body>
</html>
