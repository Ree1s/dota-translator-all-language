<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* A second chat box, drawn over the game: the same lines Dota's own
     chat shows, in English. Made to look like it belongs there - dark,
     square, names in the players' own colours - and to cost nothing
     while nothing is being said: no blur, no animation that runs on its
     own, and an empty box is not drawn at all. */
  :root {
    --ink: #e8e6df;
    --dim: rgba(232, 230, 223, 0.55);
    --allies: #a5d67a;
    --all: #c9c9c9;
    --panel-top: rgba(14, 17, 22, 0.78);
    --panel-bot: rgba(14, 17, 22, 0.62);
    --edge: rgba(255, 255, 255, 0.07);
    --warn: #ffb454;
    --size: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Radiance", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none;
    cursor: default;
  }
  body { display: flex; flex-direction: column; }
  body.bottom { justify-content: flex-end; }
  #box {
    background: linear-gradient(var(--panel-top), var(--panel-bot));
    border: 1px solid var(--edge);
    border-left: 2px solid rgba(165, 214, 122, 0.55);
    padding: 6px 10px 7px;
    color: var(--ink);
    font-size: var(--size);
    line-height: 1.32;
    /* The game is behind this, so the text needs its own contrast. */
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.95), 0 0 1px rgba(0, 0, 0, 0.9);
  }
  #box:empty { display: none; }
  .row { padding: 1px 0; transition: opacity 500ms linear; }
  .row.out { opacity: 0; }
  .tag { color: var(--all); margin-right: 5px; }
  .team .tag { color: var(--allies); }
  .name { font-weight: 600; margin-right: 5px; }
  .pending .say { color: var(--dim); font-style: italic; }
  .plain .say { color: var(--dim); }
  .orig { color: var(--dim); font-size: 0.86em; }
  /* COVER mode: a strip over each translated line of the game's own
     chat, in that line's exact slot. Dark and nearly opaque, because
     the Russian is still being drawn underneath it. */
  #cover { position: absolute; left: 0; right: 0; bottom: 0; top: 0; pointer-events: none; }
  .strip {
    position: absolute;
    display: flex; align-items: center;
    white-space: nowrap; overflow: hidden;
    /* Only as dark as hiding the line underneath needs, fading out to the
       right so it does not read as a box with an edge. */
    background: linear-gradient(90deg, rgba(12, 15, 19, 0.9) 0, rgba(12, 15, 19, 0.9) calc(100% - 28px), rgba(12, 15, 19, 0) 100%);
    padding-right: 30px;
    border-radius: 3px 0 0 3px;
    transition: background 700ms linear;
    color: #fff; font-weight: 700;
    /* Outlined as well as shadowed, as the game's chat is: once the box
       has gone this is all that stands between the text and the terrain. */
    text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000, 0 2px 3px rgba(0, 0, 0, 0.9);
  }
  /* The game's own line has faded: nothing left to hide, so no box -
     bare text with a shadow, which is all Dota's chat is. */
  .strip.bare { background: none; }
  .strip.bare .orig { color: rgba(232, 230, 223, 0.8); }
  .strip .tag { color: #fff; }
  .strip .orig { font-weight: 400; margin-left: 0.4em; }
  .strip.wrap { white-space: normal; align-items: flex-start; line-height: 1.25; }
  .status { color: var(--warn); font-size: 13px; padding: 1px 0; transition: opacity 500ms linear; }
  .status.out { opacity: 0; }
</style>
</head>
<body>
  <div id="box"></div>
  <div id="cover"></div>
  <script src="overlay.js"></script>
</body>
</html>
